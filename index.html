<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Resonancias DICOM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .upload-section {
            padding: 40px;
            text-align: center;
        }
        
        .upload-box {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 60px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-box:hover {
            background: #eef1ff;
            border-color: #764ba2;
            transform: translateY(-2px);
        }
        
        .upload-box.dragover {
            background: #e0e7ff;
            border-color: #4f46e5;
        }
        
        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 20px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .viewer-section {
            display: none;
            padding: 30px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .control-group {
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-group label {
            font-weight: 600;
            color: #555;
        }
        
        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .viewer-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }
        
        #dicomCanvas {
            width: 100%;
            max-height: 600px;
            display: block;
            background: #000;
        }
        
        .image-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .info-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        
        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .nav-button {
            background: #667eea;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }
        
        .image-counter {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            min-width: 120px;
            text-align: center;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: none;
        }
        
        .status.error {
            background: #fee;
            color: #c00;
            display: block;
        }
        
        .status.success {
            background: #efe;
            color: #060;
            display: block;
        }
        
        .status.info {
            background: #eef;
            color: #006;
            display: block;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            .control-group {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Visualizador de Resonancias DICOM</h1>
            <p>Herramienta profesional para revisión de imágenes médicas</p>
        </div>
        
        <div class="upload-section" id="uploadSection">
            <div class="upload-box" id="uploadBox">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Haz clic aquí para seleccionar archivos DICOM</div>
                <div class="upload-hint">O arrastra archivos .dcm aquí - Soporta múltiples archivos</div>
                <input type="file" id="fileInput" accept=".dcm,.dicom" multiple>
            </div>
            <div class="status" id="status"></div>
        </div>
        
        <div class="viewer-section" id="viewerSection">
            <div class="controls">
                <div class="control-group">
                    <label>Brillo:</label>
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </div>
                <div class="control-group">
                    <label>Contraste:</label>
                    <input type="range" id="contrast" min="50" max="150" value="100">
                </div>
                <button onclick="resetControls()">🔄 Restablecer</button>
                <button onclick="loadNewFiles()">📁 Cargar Nuevos</button>
            </div>
            
            <div class="navigation">
                <button class="nav-button" onclick="previousImage()">◀</button>
                <div class="image-counter" id="imageCounter">1 / 1</div>
                <button class="nav-button" onclick="nextImage()">▶</button>
            </div>
            
            <div class="viewer-container">
                <canvas id="dicomCanvas"></canvas>
            </div>
            
            <div class="image-info" id="imageInfo"></div>
        </div>
    </div>

    <script src="https://unpkg.com/dicom-parser@1.8.13/dist/dicomParser.min.js"></script>
    <script>
        let images = [];
        let currentImageIndex = 0;
        let currentImageData = null;
        let isLibraryLoaded = false;
        
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const viewerSection = document.getElementById('viewerSection');
        const canvas = document.getElementById('dicomCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        
        // Esperar a que todo se cargue
        window.addEventListener('load', function() {
            // Verificar si dicomParser se cargó
            if (typeof dicomParser !== 'undefined') {
                isLibraryLoaded = true;
                showStatus('Listo para cargar archivos DICOM', false, 'info');
            } else {
                showStatus('Advertencia: Librería DICOM no disponible. Intentando modo alternativo...', false, 'info');
            }
            
            setupEventListeners();
        });
        
        function setupEventListeners() {
            uploadBox.addEventListener('click', () => {
                fileInput.click();
            });
            
            uploadBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadBox.classList.add('dragover');
            });
            
            uploadBox.addEventListener('dragleave', () => {
                uploadBox.classList.remove('dragover');
            });
            
            uploadBox.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadBox.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
            
            document.getElementById('brightness').addEventListener('input', renderImage);
            document.getElementById('contrast').addEventListener('input', renderImage);
            
            document.addEventListener('keydown', (e) => {
                if (viewerSection.style.display === 'block') {
                    if (e.key === 'ArrowRight') nextImage();
                    if (e.key === 'ArrowLeft') previousImage();
                }
            });
        }
        
        function showStatus(message, isError = false, type = 'success') {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + (isError ? 'error' : type);
            if (type !== 'info') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
        }
        
        function handleFiles(files) {
            if (files.length === 0) return;
            
            showStatus('Cargando archivos DICOM...', false, 'info');
            images = [];
            let loadedCount = 0;
            
            Array.from(files).forEach((file) => {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        const arrayBuffer = e.target.result;
                        const byteArray = new Uint8Array(arrayBuffer);
                        
                        let dataSet = null;
                        if (isLibraryLoaded && typeof dicomParser !== 'undefined') {
                            dataSet = dicomParser.parseDicom(byteArray);
                        }
                        
                        images.push({
                            file: file,
                            dataSet: dataSet,
                            byteArray: byteArray
                        });
                        
                        loadedCount++;
                        if (loadedCount === files.length) {
                            if (images.length > 0) {
                                currentImageIndex = 0;
                                initViewer();
                                showStatus(`${images.length} archivo(s) cargado(s) correctamente`);
                            } else {
                                showStatus('No se pudieron cargar los archivos', true);
                            }
                        }
                    } catch (err) {
                        console.error('Error al procesar archivo:', err);
                        showStatus(`Error: ${err.message}. ¿Es un archivo DICOM válido?`, true);
                        loadedCount++;
                    }
                };
                
                reader.onerror = function() {
                    showStatus('Error al leer el archivo', true);
                    loadedCount++;
                };
                
                reader.readAsArrayBuffer(file);
            });
        }
        
        function initViewer() {
            uploadSection.style.display = 'none';
            viewerSection.style.display = 'block';
            loadImage(currentImageIndex);
        }
        
        function readUint16(byteArray, offset) {
            return byteArray[offset] | (byteArray[offset + 1] << 8);
        }
        
        function readUint32(byteArray, offset) {
            return byteArray[offset] | 
                   (byteArray[offset + 1] << 8) | 
                   (byteArray[offset + 2] << 16) | 
                   (byteArray[offset + 3] << 24);
        }
        
        function findDicomTag(byteArray, tag) {
            const tagBytes = [
                parseInt(tag.substring(1, 3), 16),
                parseInt(tag.substring(3, 5), 16),
                parseInt(tag.substring(5, 7), 16),
                parseInt(tag.substring(7, 9), 16)
            ];
            
            for (let i = 0; i < byteArray.length - 8; i++) {
                if (byteArray[i] === tagBytes[0] &&
                    byteArray[i + 1] === tagBytes[1] &&
                    byteArray[i + 2] === tagBytes[2] &&
                    byteArray[i + 3] === tagBytes[3]) {
                    return i;
                }
            }
            return -1;
        }
        
        function loadImage(index) {
            const image = images[index];
            const dataSet = image.dataSet;
            const byteArray = image.byteArray;
            
            try {
                let width, height, pixelDataOffset, pixelDataLength;
                
                if (dataSet) {
                    // Usar dicomParser si está disponible
                    const pixelDataElement = dataSet.elements.x7fe00010;
                    width = dataSet.uint16('x00280011');
                    height = dataSet.uint16('x00280010');
                    pixelDataOffset = pixelDataElement.dataOffset;
                    pixelDataLength = pixelDataElement.length / 2;
                } else {
                    // Modo manual básico
                    const widthTag = findDicomTag(byteArray, 'x00280011');
                    const heightTag = findDicomTag(byteArray, 'x00280010');
                    const pixelDataTag = findDicomTag(byteArray, 'x7fe00010');
                    
                    if (widthTag === -1 || heightTag === -1 || pixelDataTag === -1) {
                        throw new Error('No se encontraron las etiquetas DICOM necesarias');
                    }
                    
                    width = readUint16(byteArray, widthTag + 8);
                    height = readUint16(byteArray, heightTag + 8);
                    pixelDataOffset = pixelDataTag + 8;
                    pixelDataLength = width * height;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                const pixelData = new Uint16Array(
                    byteArray.buffer,
                    pixelDataOffset,
                    pixelDataLength
                );
                
                currentImageData = {
                    pixelData: pixelData,
                    width: width,
                    height: height
                };
                
                renderImage();
                updateImageInfo(dataSet, width, height, image.file.name);
                updateCounter();
                
            } catch (err) {
                console.error('Error al cargar imagen:', err);
                showStatus('Error al mostrar la imagen DICOM: ' + err.message, true);
            }
        }
        
        function renderImage() {
            if (!currentImageData) return;
            
            const { pixelData, width, height } = currentImageData;
            const brightness = document.getElementById('brightness').value / 100;
            const contrast = document.getElementById('contrast').value / 100;
            
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            
            let min = pixelData[0];
            let max = pixelData[0];
            for (let i = 0; i < pixelData.length; i++) {
                if (pixelData[i] < min) min = pixelData[i];
                if (pixelData[i] > max) max = pixelData[i];
            }
            
            const range = max - min || 1;
            
            for (let i = 0; i < pixelData.length; i++) {
                let value = (pixelData[i] - min) / range;
                value = ((value - 0.5) * contrast + 0.5) * brightness;
                value = Math.max(0, Math.min(1, value));
                
                const pixelValue = Math.round(value * 255);
                const idx = i * 4;
                data[idx] = pixelValue;
                data[idx + 1] = pixelValue;
                data[idx + 2] = pixelValue;
                data[idx + 3] = 255;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        function updateImageInfo(dataSet, width, height, filename) {
            const info = document.getElementById('imageInfo');
            
            function getString(tag) {
                try {
                    if (dataSet) {
                        return dataSet.string(tag) || 'No disponible';
                    }
                    return 'No disponible';
                } catch {
                    return 'No disponible';
                }
            }
            
            info.innerHTML = `
                <div class="info-item">
                    <div class="info-label">Archivo</div>
                    <div class="info-value">${filename}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Dimensiones</div>
                    <div class="info-value">${width} × ${height}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Modalidad</div>
                    <div class="info-value">${getString('x00080060')}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Fecha del Estudio</div>
                    <div class="info-value">${getString('x00080020')}</div>
                </div>
            `;
        }
        
        function updateCounter() {
            document.getElementById('imageCounter').textContent = 
                `${currentImageIndex + 1} / ${images.length}`;
        }
        
        function nextImage() {
            if (currentImageIndex < images.length - 1) {
                currentImageIndex++;
                loadImage(currentImageIndex);
            }
        }
        
        function previousImage() {
            if (currentImageIndex > 0) {
                currentImageIndex--;
                loadImage(currentImageIndex);
            }
        }
        
        function resetControls() {
            document.getElementById('brightness').value = 100;
            document.getElementById('contrast').value = 100;
            renderImage();
        }
        
        function loadNewFiles() {
            viewerSection.style.display = 'none';
            uploadSection.style.display = 'block';
            images = [];
            currentImageIndex = 0;
            currentImageData = null;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Resonancias DICOM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .loading {
            padding: 60px;
            text-align: center;
        }
        
        .loading-icon {
            font-size: 4em;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.3em;
            color: #333;
            margin-top: 20px;
        }
        
        .viewer-section {
            display: none;
            padding: 30px;
        }
        
        .series-selector {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .series-selector h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .series-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .series-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .series-btn:hover {
            background: #eef1ff;
        }
        
        .series-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .control-group {
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-group label {
            font-weight: 600;
            color: #555;
        }
        
        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .viewer-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }
        
        #dicomCanvas {
            width: 100%;
            max-height: 600px;
            display: block;
            background: #000;
        }
        
        .image-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .info-label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
            word-break: break-word;
        }
        
        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .nav-button {
            background: #667eea;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            border: none;
            cursor: pointer;
        }
        
        .image-counter {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            min-width: 150px;
            text-align: center;
        }
        
        .error {
            padding: 40px;
            text-align: center;
            color: #c00;
        }
        
        @media (max-width: 768px) {
            .controls, .series-buttons {
                flex-direction: column;
            }
            
            .control-group {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Visualizador de Resonancias DICOM</h1>
            <p>Herramienta profesional para revisión de imágenes médicas</p>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-icon">⏳</div>
            <div class="loading-text">Cargando imágenes DICOM...</div>
        </div>
        
        <div class="viewer-section" id="viewerSection">
            <div class="series-selector" id="seriesSelector">
                <h3>📂 Series Disponibles:</h3>
                <div class="series-buttons" id="seriesButtons"></div>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Brillo:</label>
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </div>
                <div class="control-group">
                    <label>Contraste:</label>
                    <input type="range" id="contrast" min="50" max="150" value="100">
                </div>
                <button onclick="resetControls()">🔄 Restablecer</button>
            </div>
            
            <div class="navigation">
                <button class="nav-button" onclick="previousImage()">◀</button>
                <div class="image-counter" id="imageCounter">Corte 1 / 1</div>
                <button class="nav-button" onclick="nextImage()">▶</button>
            </div>
            
            <div class="viewer-container">
                <canvas id="dicomCanvas"></canvas>
            </div>
            
            <div class="image-info" id="imageInfo"></div>
        </div>
    </div>

    <script src="https://unpkg.com/dicom-parser@1.8.13/dist/dicomParser.min.js"></script>
    <script>
        // Auto-detectar archivos DICOM desde GitHub
        async function autoDetectDicomFiles() {
            const basePath = 'DICOM/S00001';
            const series = [
                'SER00001', 'SER00002', 'SER00003', 'SER00004', 'SER00005',
                'SER00006', 'SER00007', 'SER00008', 'SER00009', 'SER00010'
            ];
            
            const dicomFiles = {};
            
            for (const seriesName of series) {
                dicomFiles[seriesName] = [];
                
                // Cargar archivos con patrón I00001, I00002, etc. hasta I00300
                for (let i = 1; i <= 300; i++) {
                    const paddedNum = String(i).padStart(5, '0');
                    const fileName = `${basePath}/${seriesName}/I${paddedNum}`;
                    
                    try {
                        const response = await fetch(fileName, { method: 'HEAD' });
                        if (response.ok) {
                            dicomFiles[seriesName].push(fileName);
                        } else {
                            // Si no encontramos 5 archivos consecutivos, terminamos
                            if (i > 5 && dicomFiles[seriesName].length > 0) {
                                break;
                            }
                        }
                    } catch (e) {
                        // Si no encontramos 5 archivos consecutivos, terminamos
                        if (i > 5 && dicomFiles[seriesName].length > 0) {
                            break;
                        }
                    }
                }
            }
            
            // Eliminar series vacías
            for (const key in dicomFiles) {
                if (dicomFiles[key].length === 0) {
                    delete dicomFiles[key];
                }
            }
            
            return dicomFiles;
        }

        let seriesData = {};
        let currentSeries = null;
        let currentImageIndex = 0;
        let currentImageData = null;
        const canvas = document.getElementById('dicomCanvas');
        const ctx = canvas.getContext('2d');
        
        window.addEventListener('load', async function() {
            try {
                const dicomFiles = await autoDetectDicomFiles();
                await loadAllDicomFiles(dicomFiles);
                initViewer();
            } catch (err) {
                showError('Error al cargar las imágenes: ' + err.message);
            }
        });
        
        async function loadAllDicomFiles(dicomFiles) {
            const loading = document.getElementById('loading');
            
            for (const [seriesName, files] of Object.entries(dicomFiles)) {
                seriesData[seriesName] = [];
                
                for (const filePath of files) {
                    try {
                        const response = await fetch(filePath);
                        if (!response.ok) continue;
                        
                        const arrayBuffer = await response.arrayBuffer();
                        const byteArray = new Uint8Array(arrayBuffer);
                        
                        let dataSet = null;
                        if (typeof dicomParser !== 'undefined') {
                            dataSet = dicomParser.parseDicom(byteArray);
                        }
                        
                        seriesData[seriesName].push({
                            file: filePath,
                            dataSet: dataSet,
                            byteArray: byteArray
                        });
                        
                        loading.querySelector('.loading-text').textContent = 
                            `Cargando: ${seriesName} (${seriesData[seriesName].length} imágenes)`;
                        
                    } catch (err) {
                        console.error(`Error cargando ${filePath}:`, err);
                    }
                }
            }
        }
        
        function showError(message) {
            const loading = document.getElementById('loading');
            loading.innerHTML = `<div class="error"><h2>❌ Error</h2><p>${message}</p><p>Verifica que los archivos DICOM estén en la carpeta correcta</p></div>`;
        }
        
        function initViewer() {
            if (Object.keys(seriesData).length === 0) {
                showError('No se encontraron archivos DICOM. Verifica que estén en DICOM/S00001/SER000XX/');
                return;
            }
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('viewerSection').style.display = 'block';
            
            const seriesButtonsContainer = document.getElementById('seriesButtons');
            seriesButtonsContainer.innerHTML = '';
            
            Object.keys(seriesData).forEach((seriesName, index) => {
                const btn = document.createElement('button');
                btn.className = 'series-btn';
                btn.textContent = `${seriesName} (${seriesData[seriesName].length} cortes)`;
                btn.onclick = () => loadSeries(seriesName);
                seriesButtonsContainer.appendChild(btn);
                
                if (index === 0) {
                    currentSeries = seriesName;
                    btn.classList.add('active');
                }
            });
            
            currentImageIndex = 0;
            loadImage(currentImageIndex);
            
            document.getElementById('brightness').addEventListener('input', renderImage);
            document.getElementById('contrast').addEventListener('input', renderImage);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') previousImage();
            });
        }
        
        function loadSeries(seriesName) {
            currentSeries = seriesName;
            currentImageIndex = 0;
            
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.startsWith(seriesName)) {
                    btn.classList.add('active');
                }
            });
            
            loadImage(currentImageIndex);
        }
        
        function readUint16(byteArray, offset) {
            return byteArray[offset] | (byteArray[offset + 1] << 8);
        }
        
        function findDicomTag(byteArray, tag) {
            const tagBytes = [
                parseInt(tag.substring(1, 3), 16),
                parseInt(tag.substring(3, 5), 16),
                parseInt(tag.substring(5, 7), 16),
                parseInt(tag.substring(7, 9), 16)
            ];
            
            for (let i = 0; i < byteArray.length - 8; i++) {
                if (byteArray[i] === tagBytes[0] &&
                    byteArray[i + 1] === tagBytes[1] &&
                    byteArray[i + 2] === tagBytes[2] &&
                    byteArray[i + 3] === tagBytes[3]) {
                    return i;
                }
            }
            return -1;
        }
        
        function loadImage(index) {
            const images = seriesData[currentSeries];
            if (!images || index >= images.length) return;
            
            const image = images[index];
            const dataSet = image.dataSet;
            const byteArray = image.byteArray;
            
            try {
                let width, height, pixelDataOffset, pixelDataLength;
                
                if (dataSet) {
                    const pixelDataElement = dataSet.elements.x7fe00010;
                    width = dataSet.uint16('x00280011');
                    height = dataSet.uint16('x00280010');
                    pixelDataOffset = pixelDataElement.dataOffset;
                    pixelDataLength = pixelDataElement.length / 2;
                } else {
                    const widthTag = findDicomTag(byteArray, 'x00280011');
                    const heightTag = findDicomTag(byteArray, 'x00280010');
                    const pixelDataTag = findDicomTag(byteArray, 'x7fe00010');
                    
                    if (widthTag === -1 || heightTag === -1 || pixelDataTag === -1) {
                        throw new Error('Etiquetas DICOM no encontradas');
                    }
                    
                    width = readUint16(byteArray, widthTag + 8);
                    height = readUint16(byteArray, heightTag + 8);
                    pixelDataOffset = pixelDataTag + 8;
                    pixelDataLength = width * height;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                const pixelData = new Uint16Array(
                    byteArray.buffer,
                    pixelDataOffset,
                    pixelDataLength
                );
                
                currentImageData = {
                    pixelData: pixelData,
                    width: width,
                    height: height
                };
                
                renderImage();
                updateImageInfo(dataSet, width, height, image.file);
                updateCounter();
                
            } catch (err) {
                console.error('Error:', err);
            }
        }
        
        function renderImage() {
            if (!currentImageData) return;
            
            const { pixelData, width, height } = currentImageData;
            const brightness = document.getElementById('brightness').value / 100;
            const contrast = document.getElementById('contrast').value / 100;
            
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            
            let min = pixelData[0];
            let max = pixelData[0];
            for (let i = 0; i < pixelData.length; i++) {
                if (pixelData[i] < min) min = pixelData[i];
                if (pixelData[i] > max) max = pixelData[i];
            }
            
            const range = max - min || 1;
            
            for (let i = 0; i < pixelData.length; i++) {
                let value = (pixelData[i] - min) / range;
                value = ((value - 0.5) * contrast + 0.5) * brightness;
                value = Math.max(0, Math.min(1, value));
                
                const pixelValue = Math.round(value * 255);
                const idx = i * 4;
                data[idx] = pixelValue;
                data[idx + 1] = pixelValue;
                data[idx + 2] = pixelValue;
                data[idx + 3] = 255;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        function updateImageInfo(dataSet, width, height, filename) {
            const info = document.getElementById('imageInfo');
            
            function getString(tag) {
                try {
                    if (dataSet) {
                        return dataSet.string(tag) || 'No disponible';
                    }
                    return 'No disponible';
                } catch {
                    return 'No disponible';
                }
            }
            
            const displayName = filename.split('/').pop();
            
            info.innerHTML = `
                <div class="info-item">
                    <div class="info-label">Serie Actual</div>
                    <div class="info-value">${currentSeries}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Archivo</div>
                    <div class="info-value">${displayName}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Dimensiones</div>
                    <div class="info-value">${width} × ${height}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Modalidad</div>
                    <div class="info-value">${getString('x00080060')}</div>
                </div>
            `;
        }
        
        function updateCounter() {
            const images = seriesData[currentSeries];
            document.getElementById('imageCounter').textContent = 
                `Corte ${currentImageIndex + 1} / ${images.length}`;
        }
        
        function nextImage() {
            const images = seriesData[currentSeries];
            if (currentImageIndex < images.length - 1) {
                currentImageIndex++;
                loadImage(currentImageIndex);
            }
        }
        
        function previousImage() {
            if (currentImageIndex > 0) {
                currentImageIndex--;
                loadImage(currentImageIndex);
            }
        }
        
        function resetControls() {
            document.getElementById('brightness').value = 100;
            document.getElementById('contrast').value = 100;
            renderImage();
        }
    </script>
</body>
</html>
